[package]
name = "netssh"
    version = "0.3.0"
description = "Cross-platform SSH client with context-aware command suggestions"
authors = ["Andy Norwood"]
edition = "2021"

[lib]
name = "netssh_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
# P1.4 — in-app updater (minisign) + relaunch after install (ADR-005)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
# 0.49: authenticate_future → authenticate_publickey_with, whose future is
# provably Send (0.46's generic shape broke the tauri command Send bound).
russh = "0.49"
tokio = { version = "1", features = ["full"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
log = "0.4"
simplelog = { version = "0.12", features = ["local-offset"] }
# Direct dep: simplelog's format_description! macro emits `use ::time::...`, so it must resolve here.
time = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
zip = "2"
