[package]
name = "comnd"
    version = "0.5.0"
description = "Cross-platform SSH client with context-aware command suggestions"
authors = ["Andy Norwood"]
edition = "2021"

[lib]
name = "comnd_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
# P1.4 — in-app updater (minisign) + relaunch after install (ADR-006)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yml's libyml backend is unsound and unmaintained (GHSA-gfxp-f68g-8x78,
# Dependabot #44/#45); yaml_serde is the maintained serde-yaml fork.
yaml_serde = "0.10"
# 0.63: security fixes for CVE-2026-46702/46705/48107/48108/48110, CVE-2026-68930,
# CVE-2026-73429/73430/73489, CVE-2026-102821/102822/102823/102824/102825
# (Dependabot #61-#75; 0.63.2 is the lowest non-vulnerable version). ring backend
# (same crypto as the 0.49 build) — the aws-lc-rs default backend needs NASM on
# every Windows build machine, including the windows-latest release runner.
# rsa keeps ssh-rsa host keys working (Cisco/F5 devices).
russh = { version = "0.64", default-features = false, features = ["flate2", "rsa", "ring"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
log = "0.4"
simplelog = { version = "0.12", features = ["local-offset"] }
# Direct dep: simplelog's format_description! macro emits `use ::time::...`, so it must resolve here.
time = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# 9.x clears the zip path-traversal alerts (Dependabot #94/#95/#96) and resolves to a
# single copy alongside tauri-plugin-updater 2.14.1's `zip = "9"`.
zip = "9"
