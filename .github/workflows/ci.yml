name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      # Lint runs on one leg: the rules are behavioural, so the result cannot
      # differ by OS, and type-aware resolution reads the same tsconfig on every
      # runner. The rule set is deliberately small (see eslint.config.mjs).
      - name: eslint (typescript-eslint, type-aware)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run lint

      # stylelint covers declarations; scripts/check-css-tokens.mjs covers the
      # cross-file rules stylelint cannot see (TypeScript reads, unused tokens,
      # theme coverage, var() fallbacks). Standard: docs/adr/018-css-token-naming-standard.md
      - name: css token gate (stylelint + token checker)
        run: npm run lint:css

      # .editorconfig is editor-only, so nothing re-checks what it asks for.
      # scripts/check-eol.mjs reads the git index rather than the working tree:
      # a Windows checkout is CRLF under core.autocrlf, and the committed bytes
      # are what the rule is about. That also makes the step OS-independent.
      - name: editorconfig gate (final newline, trailing whitespace, LF)
        run: npm run lint:eol

      - name: typecheck + build (tsc, vite)
        run: npm run build

      - name: unit tests (vitest)
        run: npm run test

      # Coverage runs on one leg only, so the reports are a Linux baseline: `#[cfg]`
      # gated code differs per OS and the macOS/Windows paths are unmeasured.
      # The two line floors live in vitest.config.ts, so this step is the frontend
      # gate as well as the report; docs/plans/065-plan-test-coverage.md holds the
      # derivation.
      - name: unit test coverage (vitest, v8)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:coverage

      - name: upload frontend coverage
        # `always()` so a red floor still uploads the report you need to read it.
        if: always() && matrix.platform == 'ubuntu-22.04' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 7

  rust:
    name: rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The Rust version lives in rust-toolchain.toml at the repo root, and
      # `rustup toolchain install` installs the toolchain that file pins,
      # including the `rustfmt` and `clippy` components it declares. Bump the
      # pin deliberately, in its own PR.
      - name: install the pinned Rust toolchain
        run: rustup toolchain install

      # Only main saves a Rust cache. A cache saved by a pull request is scoped
      # to that PR's merge ref: main and other PRs can never restore it, so every
      # PR push added another set of multi-GB caches. The repository budget is
      # 10 GB, and when the inventory passed it GitHub evicted main's Linux Rust
      # cache - the largest entry - which made every PR's Linux leg cold (about
      # 8 minutes) while Windows and macOS stayed warm. One main-scoped set now
      # serves every PR through the base-branch restore.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting is OS-independent, so one leg is enough.
      - name: cargo fmt --check
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      # Every leg: `#[cfg(windows)]` / `#[cfg(unix)]` arms differ, so one leg
      # cannot see the other platforms' code.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo check
        run: cargo check
        working-directory: src-tauri

      - name: cargo test
        run: cargo test -- --nocapture
        working-directory: src-tauri

      # Release-profile tests run on one leg: cfg profile divergence is
      # platform-independent, and `--no-run` only compiles, so it cannot catch
      # a runtime assertion about a `debug_assertions`-gated registration.
      - name: cargo test --release --lib
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --release --lib
        working-directory: src-tauri

      # Rust coverage runs on one leg only (see the frontend job comment), so it is a
      # Linux baseline: `#[cfg(unix)]` / `#[cfg(windows)]` change which lines exist
      # and run, and the macOS/Windows paths are unmeasured.
      # Branch coverage needs nightly (`-Z coverage-options=branch`), which
      # would instrument a different compiler than the shipping build, so it
      # is a documented limitation rather than a step here.
      - name: install llvm-tools for coverage
        if: matrix.platform == 'ubuntu-22.04'
        run: rustup component add llvm-tools-preview

      - name: cache cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04'
        id: llvm-cov-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}

      # `swatinem/rust-cache` also caches `~/.cargo/bin`, so it can restore this
      # binary while the dedicated cache above misses. A plain install then exits
      # 101 with "binary already exists in destination", so `--force` makes the
      # step idempotent; the version pin stays authoritative because a forced
      # install replaces whatever binary the file cache restored.
      - name: install cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04' && steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked --force

      - name: rust test coverage (llvm-cov)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo llvm-cov --no-report
          # Plain `report` prints the per-file table plus TOTAL to the log.
          # `report --text` would dump 18k lines of annotated source instead.
          cargo llvm-cov report
          cargo llvm-cov report --html --output-dir target/coverage-html
          cargo llvm-cov report --lcov --output-path target/coverage.lcov
          # Per-file line counts for the floors below. cargo-llvm-cov 0.9.1 has
          # no per-area threshold, so scripts/check-rust-coverage.mjs sums these.
          cargo llvm-cov report --json --summary-only --output-path target/coverage.json
        working-directory: src-tauri

      - name: set up node for the rust coverage floors
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: rust coverage floors
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:coverage:rust

      - name: upload rust coverage
        # `always()` so a red floor still uploads the report you need to read it.
        if: always() && matrix.platform == 'ubuntu-22.04' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: |
            src-tauri/target/coverage-html/
            src-tauri/target/coverage.lcov
            src-tauri/target/coverage.json
          retention-days: 7

  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # The Rust version lives in rust-toolchain.toml at the repo root, and
      # `rustup toolchain install` installs the toolchain that file pins.
      # Bump the pin deliberately, in its own PR.
      - name: install the pinned Rust toolchain
        run: rustup toolchain install

      # The two smoke jobs build the same debug target from the same lockfile,
      # so one shared cache covers both. Two identical caches spent most of the
      # repository cache budget and were evicted: on this branch the cache was
      # missing twice, and every dependency was rebuilt (~2 min each time).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install Linux and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus

      - name: install frontend dependencies
        run: npm ci

      - name: cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}

      - name: install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Scenarios are independent (own driver, native-driver port, app, data
      # dir and Xvfb display), and on this runner nearly all of a scenario's
      # wall time is waiting for the app's WebView to be ready, so a small pool
      # overlaps it. Keep it under the runner's core count.
      #
      # `dbus-run-session` is not optional: with no session bus, WebKitGTK's
      # sandbox retries for ~30 seconds before every window is ready, which is
      # where this job's time went. It costs a scenario ~30s each.
      - name: full-app SSH smoke tests
        run: xvfb-run -a dbus-run-session -- npm run smoke -- --jobs=3

      # One process proves all seven mutation categories after the build above,
      # so `--no-build` reuses that binary: a separate invocation per category
      # re-ran the whole `tauri build` to drive a single scenario, which was
      # most of this job's mutation time.
      - name: smoke mutation checks (all categories)
        run: xvfb-run -a dbus-run-session -- npm run smoke:mutation:all -- --jobs=3 --no-build

  smoke-netbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # The Rust version lives in rust-toolchain.toml at the repo root, and
      # `rustup toolchain install` installs the toolchain that file pins.
      # Bump the pin deliberately, in its own PR.
      - name: install the pinned Rust toolchain
        run: rustup toolchain install

      # The two smoke jobs build the same debug target from the same lockfile,
      # so one shared cache covers both. Two identical caches spent most of the
      # repository cache budget and were evicted: on this branch the cache was
      # missing twice, and every dependency was rebuilt (~2 min each time).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install Linux and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus

      - name: install frontend dependencies
        run: npm ci

      - name: cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}

      - name: install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: NetBox workflow smoke tests
        run: xvfb-run -a dbus-run-session -- npm run smoke:netbox -- --jobs=3

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: git fetch origin ${{ github.event.pull_request.base.ref }}
      - run: npx commitlint --from origin/${{ github.event.pull_request.base.ref }} --to ${{ github.event.pull_request.head.sha }}
