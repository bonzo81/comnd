name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: typecheck + build (tsc, vite)
        run: npm run build

      - name: unit tests (vitest)
        run: npm run test

      # Coverage runs on one leg only, so the reports are a Linux baseline: `#[cfg]`
      # gated code differs per OS and the macOS/Windows paths are unmeasured. The
      # report is a PR artifact, not a gate. See
      # docs/plans/065-plan-test-coverage.md.
      - name: unit test coverage (vitest, v8)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:coverage

      - name: upload frontend coverage
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 7

  rust:
    name: rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        run: cargo check
        working-directory: src-tauri

      - name: cargo test
        run: cargo test -- --nocapture
        working-directory: src-tauri

      # Rust coverage runs on one leg only (see the frontend job comment), so it is a
      # Linux baseline: `#[cfg(unix)]` / `#[cfg(windows)]` change which lines exist
      # and run, and the macOS/Windows paths are unmeasured.
      # Branch coverage needs nightly (`-Z coverage-options=branch`), which
      # would instrument a different compiler than the shipping build, so it
      # is a documented limitation rather than a step here.
      - name: install llvm-tools for coverage
        if: matrix.platform == 'ubuntu-22.04'
        run: rustup component add llvm-tools-preview

      - name: cache cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04'
        id: llvm-cov-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}

      - name: install cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04' && steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: rust test coverage (llvm-cov)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo llvm-cov --no-report
          # Plain `report` prints the per-file table plus TOTAL to the log.
          # `report --text` would dump 18k lines of annotated source instead.
          cargo llvm-cov report
          cargo llvm-cov report --html --output-dir target/coverage-html
          cargo llvm-cov report --lcov --output-path target/coverage.lcov
        working-directory: src-tauri

      - name: upload rust coverage
        if: matrix.platform == 'ubuntu-22.04' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: |
            src-tauri/target/coverage-html/
            src-tauri/target/coverage.lcov
          retention-days: 7

  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install Linux and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: install frontend dependencies
        run: npm ci

      - name: cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}

      - name: install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: full-app SSH smoke tests
        run: xvfb-run -a npm run smoke

      - name: smoke mutation check
        run: xvfb-run -a npm run smoke:mutation

      - name: smoke mutation check (focus)
        run: xvfb-run -a npm run smoke -- --mutation=focus

      - name: smoke mutation check (name)
        run: xvfb-run -a npm run smoke -- --mutation=name

      - name: smoke mutation check (layout)
        run: xvfb-run -a npm run smoke -- --mutation=layout

  smoke-netbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install Linux and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: install frontend dependencies
        run: npm ci

      - name: cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}

      - name: install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: NetBox workflow smoke tests
        run: xvfb-run -a npm run smoke:netbox

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: git fetch origin ${{ github.event.pull_request.base.ref }}
      - run: npx commitlint --from origin/${{ github.event.pull_request.base.ref }} --to ${{ github.event.pull_request.head.sha }}
