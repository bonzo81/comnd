name: Release

on:
  create:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag to build, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.event.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'tag' &&
       startsWith(github.event.ref, 'v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: find the existing draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.2.0, got '$RELEASE_TAG'."
            exit 1
          fi

          # The releases list includes drafts (releases/tags/{tag} does not).
          # Fail rather than create a release if none exists for the tag.
          release="$(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[]' |
            jq -s --arg tag "$RELEASE_TAG" '
              [.[] | select(.tag_name == $tag)]
              | if length == 1 then .[0]
                else error("Expected exactly one existing release for " + $tag)
                end
            '
          )"

          if [[ "$(jq -r '.draft' <<< "$release")" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG is not a draft. Refusing to upload."
            exit 1
          fi

          release_id="$(jq -r '.id' <<< "$release")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Uploading builds for $RELEASE_TAG to draft release $release_id."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust-targets: ''
          - platform: 'windows-latest'
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # P1.4 — signs updater artifacts (latest.json + .sig) during `tauri build`.
          # Stored as a repo secret; the key itself is never checked in.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}
          # Windows updater entry should be the NSIS setup.exe (passive install),
          # not the MSI (which prompts UAC mid-update).
          updaterJsonPreferNsis: true
