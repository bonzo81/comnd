id: f5-tmos
name: F5 BIG-IP TMOS
description: F5 BIG-IP Traffic Management Operating System (tmsh + bash)
reference_url: "https://clouddocs.f5.com/cli/tmsh-reference/latest/"
versions:
  - "14.x"
  - "15.x"
  - "16.x"
prompt_patterns:
  tmsh: '^[\w\-]+(?:@\([\w\-\.]+\))?\(tmos(\.[\w]+)?\)#\s*$'
  bash: '^\[[\w\-\.@:]+\S*\][\s\$#]*\s*$'
secret_prompt_patterns:
  - '^(?:(?:[Oo]ld|[Cc]urrent|[Nn]ew|[Cc]onfirm|[Rr]e-?[Ee]nter|[Rr]etype) )?[Pp]assword:\s*$'
  - '^[Ee]nter (?:[Nn]ew )?[Pp]assword:\s*$'
default_mode: tmsh
negation_prefix: null
prefix_commands:
  tmsh:
    unlocks: [tmsh]
