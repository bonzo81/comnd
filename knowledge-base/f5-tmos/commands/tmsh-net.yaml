commands:
  - name: list net interface
    syntax: "list net interface [<name>]"
    tokens:
      - lit: list net interface
      - var: interface-name
        type: enumerable
        source: device
        optional: true
    description: |
      Lists physical interfaces and their media/speed/status.
    category: net
    mode: tmsh
    aliases:
      - list net interface
    examples:
      - command: list net interface
        description: All interfaces
      - command: list net interface 1.1
        description: Interface 1.1
    versions:
      introduced: "11.0"
      deprecated: null
      notes: null
    tags:
      - net
      - interface

  - name: list net self
    syntax: "list net self [<name>]"
    tokens:
      - lit: list net self
      - var: self-name
        type: free
        optional: true
    description: |
      Lists self IPs (floating and non-floating).
    category: net
    mode: tmsh
    aliases:
      - list net self
    examples:
      - command: list net self
        description: All self IPs
    versions:
      introduced: "11.0"
      deprecated: null
      notes: null
    tags:
      - net
      - self-ip

  - name: list net route
    syntax: "list net route [<name>]"
