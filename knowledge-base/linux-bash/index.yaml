id: linux-bash
name: Linux Bash
description: Generic Linux server with a bash shell
reference_url: "https://www.gnu.org/software/bash/manual/bash.html"
versions:
  - "bash-4"
  - "bash-5"
prompt_patterns: {}
secret_prompt_patterns:
  - '^\[sudo\] [Pp]assword(?: for [^:]+)?:\s*$'
  - '^[Pp]assword:\s*$'
default_mode: shell
negation_prefix: null
prefix_commands:
  sudo:
    unlocks: [shell]
    skip_flag_value: ["-u"]
